name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-core.txt

      - name: Install Python test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-core.txt

      - name: Run Python contract and security tests
        working-directory: backend
        env:
          JWT_SECRET: synthetic-ci-secret-for-tests-only-0123456789
        run: python -m pytest -q

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Type-check and build client
        working-directory: client
        run: |
          npm test
          npm run typecheck
          npm run build
